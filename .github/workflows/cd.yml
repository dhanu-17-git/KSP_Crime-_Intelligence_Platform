name: CD — Deploy to Zoho Catalyst

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - frontend-only
          - backend-only

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel a running deployment

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # GATE — Run CI checks before any deployment
  # ─────────────────────────────────────────────────────────────────────
  pre-deploy-checks:
    name: Pre-Deploy — Verify CI passes
    runs-on: ubuntu-latest
    outputs:
      deploy_frontend: ${{ steps.target.outputs.frontend }}
      deploy_backend: ${{ steps.target.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine deploy targets
        id: target
        run: |
          INPUT="${{ github.event.inputs.target || 'all' }}"
          if [ "$INPUT" = "all" ] || [ "$INPUT" = "frontend-only" ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi
          if [ "$INPUT" = "all" ] || [ "$INPUT" = "backend-only" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────
  # DEPLOY FRONTEND — Build Vite app, push to Catalyst Web Client
  # ─────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy — React Frontend (Catalyst Web Client)
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    if: needs.pre-deploy-checks.outputs.deploy_frontend == 'true'
    environment:
      name: production
      url: https://ksp-datathon-2026-60079582909.development.catalystserverless.in/app/index.html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Setup Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Authenticate Catalyst CLI
        run: |
          catalyst config --token "${{ secrets.CATALYST_AUTH_TOKEN }}"
        env:
          CATALYST_AUTH_TOKEN: ${{ secrets.CATALYST_AUTH_TOKEN }}

      - name: Deploy Web Client to Catalyst
        run: catalyst deploy --only web-client
        env:
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed to Catalyst"
          echo "🔗 URL: https://ksp-datathon-2026-60079582909.development.catalystserverless.in/app/index.html"

  # ─────────────────────────────────────────────────────────────────────
  # DEPLOY BACKEND — Push FastAPI service to Catalyst AppSail
  # ─────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy — FastAPI Backend (Catalyst AppSail)
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    if: needs.pre-deploy-checks.outputs.deploy_backend == 'true'
    environment:
      name: production
      url: https://ksp-crime-intel-api-50044310157.development.catalystappsail.in

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (dependency validation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate requirements installable
        working-directory: backend
        run: pip install -r requirements.txt --dry-run

      - name: Setup Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Authenticate Catalyst CLI
        run: |
          catalyst config --token "${{ secrets.CATALYST_AUTH_TOKEN }}"
        env:
          CATALYST_AUTH_TOKEN: ${{ secrets.CATALYST_AUTH_TOKEN }}

      - name: Deploy AppSail service to Catalyst
        run: catalyst deploy --only appsail
        env:
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}

      - name: Health check post-deploy
        run: |
          echo "Waiting 30s for AppSail service to start..."
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://ksp-crime-intel-api-50044310157.development.catalystappsail.in/api/v1/health)
          echo "Health check HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Backend health check passed"

      - name: Deployment summary
        run: |
          echo "✅ Backend deployed to Catalyst AppSail"
          echo "🔗 API: https://ksp-crime-intel-api-50044310157.development.catalystappsail.in"
          echo "📋 Docs: https://ksp-crime-intel-api-50044310157.development.catalystappsail.in/docs"

  # ─────────────────────────────────────────────────────────────────────
  # NOTIFY — Post deployment status summary
  # ─────────────────────────────────────────────────────────────────────
  notify-deployment:
    name: Notify — Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always()

    steps:
      - name: Summarize deployment
        run: |
          echo "## 🚀 KSP Crime Intelligence Platform — Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          FRONTEND_STATUS="${{ needs.deploy-frontend.result }}"
          BACKEND_STATUS="${{ needs.deploy-backend.result }}"
          echo "| 🌐 Frontend (React) | $FRONTEND_STATUS | [Web App](https://ksp-datathon-2026-60079582909.development.catalystserverless.in/app/index.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ Backend (FastAPI) | $BACKEND_STATUS | [API Docs](https://ksp-crime-intel-api-50044310157.development.catalystappsail.in/docs) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
